[build-system]
requires = ["setuptools>=77", "wheel"]   # 77: the SPDX `license` string below
build-backend = "setuptools.build_meta"

[project]
name = "kv-routing-sim"
version = "0.1.0"
description = "Trace-driven simulator and recommender for multi-replica LLM KV-cache routing policies, calibrated against a live inference engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harshit" }]   # as in LICENSE; an e-mail is added at release
keywords = ["llm", "inference", "vllm", "kv-cache", "prefix-caching", "routing", "load-balancing",
            "simulator", "capacity-planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Benchmark",
]

# The core install is small and CPU-only (ADR-009): `pip install kv-routing-sim` must never pull a
# GPU dependency. vLLM lives in the `calib` extra for the calibration box; `kvsim calibrate` itself
# only needs HTTP access to a running engine.
dependencies = [
    "pyyaml>=6.0",            # the cost model, profiles and experiment configs
]

[project.optional-dependencies]
# For the calibration box only, never a user dependency. vLLM is pinned to the version whose metric
# names were checked (ADR-008: the hit rate is vllm:prefix_cache_hits / vllm:prefix_cache_queries).
calib = [
    "vllm==0.30.0",
    "httpx>=0.27",                 # /metrics scraping and the load generator
    "prometheus-client>=0.20",     # parses the Prometheus exposition format
]
# Parallel sweeps across (policy, replica count, seed)
sweep = ["joblib>=1.4"]
# Result analysis (numpy) and the README's figures (matplotlib)
analysis = ["numpy>=1.26", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/gitgod-debug/kv-routing-sim"
Demo = "https://gitgod-debug.github.io/kv-routing-sim/"
Changelog = "https://github.com/gitgod-debug/kv-routing-sim/blob/main/CHANGELOG.md"
Issues = "https://github.com/gitgod-debug/kv-routing-sim/issues"

[project.scripts]
kvsim = "kv_routing_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The measured T4 profiles and the cited cost model ship with the package, so `--profile <name>` and
# `--cost-model default` work without a clone.
[tool.setuptools.package-data]
kv_routing_sim = ["data/*.yaml", "data/profiles/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Notebooks keep imports in the cell that needs them and probe unfamiliar machines broadly, so they
# are not linted as library code; artifacts/ holds raw outputs of runs, kept byte for byte.
extend-exclude = ["*.ipynb", "artifacts"]

[tool.ruff.lint]
# E501 is not in ruff's default rule set; without it the line length above would not be enforced.
extend-select = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Notebook templates: their Markdown tables and cell sources are strings that cannot be wrapped.
"scripts/_phase3_notebook.py" = ["E501"]
"scripts/_phase6_notebook.py" = ["E501"]
"scripts/_c1_notebook.py" = ["E501"]
"scripts/_c2_notebook.py" = ["E501"]
"scripts/_c3_notebook.py" = ["E501"]
"scripts/_c4_notebook.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
