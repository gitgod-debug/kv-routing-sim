# Lint and tests on every push and pull request, on CPU only: the core install must never need a
# GPU wheel. A second job derives the stored results again and compares them with the committed
# files, so that "one command checks it" is tested on a machine that is not the author's.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package with its dev extras
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  # Quick mode leaves out the three steps that take minutes. They are run by hand before a release.
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package with numpy
        run: python -m pip install -e ".[analysis]"
      - name: Derive the stored results again and compare them with the committed files
        run: python scripts/reproduce.py --quick
