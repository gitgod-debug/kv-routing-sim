# Publishes the static site to GitHub Pages: the pages in site/, the demo grids, and a wheel of the
# package that the in-browser runner installs. Repository setting: Pages source = GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "pyproject.toml"
      - "artifacts/results/demo_grid*.json"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the site
        run: python scripts/build_site.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
