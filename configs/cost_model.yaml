# ─────────────────────────────────────────────────────────────────────────────────────────────
# The cost model. See ADR-006 and docs/06-methodology.md §2.
#
# THE RULE: every value here carries a `source:` and a `date:`. A skeptical reader must be able to
# disagree with a constant, change it, re-run, and get their own number. No hidden divisors, and no
# constant defined in Python.
#
# Every value is `<TBD>` until it is filled from a cited source. That is deliberate: an uncited
# constant should be STRUCTURALLY obvious, not merely discouraged. `eval/cost.py` refuses to run
# while any `<TBD>` remains, rather than silently treating it as zero.
# ─────────────────────────────────────────────────────────────────────────────────────────────

schema_version: 1
currency: INR

fx:
  usd_to_inr: <TBD>
  source: <TBD>            # e.g. RBI reference rate page
  date: <TBD>

# The reference SKU. ⚠️ This is NOT the box the calibration happened to run on — it is a named,
# publicly-priced instance that a reader can look up. State it in every caption that carries a ₹.
compute:
  sku: <TBD>               # e.g. "1x A100 80GB, <provider> <instance-name>"
  provider: <TBD>
  region: <TBD>
  gpus_per_instance: <TBD>
  price_per_hour_usd: <TBD>
  source: <TBD>            # pricing page URL
  date: <TBD>

# The SLO. This is a cost-model input, not a reporting choice: the cost denominator is SUCCESSFUL
# requests, and "successful" means "met this". A configuration that serves more traffic by blowing
# p95 has not got cheaper — it has changed the product.
slo:
  ttft_p95_ms: <TBD>
  source: <TBD>            # which real-world target this reflects, and why
  date: <TBD>

# What this model deliberately EXCLUDES, recorded so a reader knows it is a choice, not an
# oversight. Compute is >90% of the bill for this workload, and adding poorly-sourced small terms
# makes the headline number less trustworthy, not more.
excluded:
  - networking_egress
  - control_plane_overhead
  - engineering_time
  - kv_cache_storage    # ephemeral; lives in HBM we are already paying for

# The formula, written out so nobody has to reverse-engineer it from code:
#
#   ₹ per 1k successful requests
#     = (replicas × price_per_hour_usd × usd_to_inr) ÷ successful_requests_per_hour × 1000
#
# `replicas` is the axis being swept, so cost is not a constant multiplier — which is the whole
# point of H5: the recommendation may save money by REMOVING a replica.
